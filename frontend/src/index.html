<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CNC Quick Quote</title>
    <base href="/" id="app-base" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1220" />
    <meta name="description" content="Upload a DXF, place your bends, pick a material and get an instant laser-cutting quote." />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      /*
       * Path-prefix resolution. The production build is emitted with an explicit
       * --base-href, so this is a no-op there. Only when the build used the
       * relative "./" base (static preview hosting under an unknown /<id>/ path
       * prefix) do we pin the base to the first path segment, which keeps every
       * route deep-linkable at any nesting depth.
       */
      (function () {
        var el = document.getElementById('app-base');
        if (el && el.getAttribute('href') === './') {
          var seg = window.location.pathname.split('/')[1];
          el.setAttribute('href', seg ? '/' + seg + '/' : '/');
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
